version: 1
disable_existing_loggers: false

formatters:
  standard:
    format: "%(asctime)s - %(levelname)s - [%(name)s:%(lineno)d] - %(message)s"
  simple:
    format: "%(levelname)s - [%(name)s] - %(message)s"

handlers:
  
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: simple
    stream: ext://sys.stdout

  
  app_file:
    class: logging.handlers.RotatingFileHandler
    level: DEBUG
    formatter: standard
    filename: app.log 
    maxBytes: 10485760 # 10 MB
    backupCount: 4
    encoding: utf8

  error_file:
    class: logging.handlers.RotatingFileHandler
    level: ERROR
    formatter: standard
    filename: error.log
    maxBytes: 10485760 
    backupCount: 5
    encoding: utf8

root: 
  level: DEBUG
  handlers:
    - console
    - app_file
    - error_file