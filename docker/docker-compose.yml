services:
  mongodb:
    image: mongo:noble
    container_name: mongo

    restart: always

    ports:
      - "8090:27017"

    volumes:
      - mongodb_data:/data/db
    
    networks:
      - backend

    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}

volumes:
  mongodb_data:

networks:
  backend: