[project]
name = "mini-rag"
version = "0.1.0"
description = "A lightweight, modular FastAPI backend for Retrieval-Augmented Generation (RAG) with multi-LLM support."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=25.1.0",
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "cohere>=7.0.5",
    "fastapi>=0.138.1",
    "google-genai>=2.12.1",
    "langchain-community>=0.4.2",
    "openai>=2.45.0",
    "pydantic-settings>=2.14.2",
    "pymupdf>=1.28.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.18.0",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.49.0",
]
