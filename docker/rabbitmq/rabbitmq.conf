# RAM alarm upper bound
vm_memory_high_watermark.relative = 0.6

# free disk alarm lower bound
disk_free_limit.absolute = 2GB

ssl_options.verify = verify_none # verify_none -> don't check client certificate(in case of TLS connection)

management.tcp.port = 15672

# Celery/Kombu compatibility - allow transient non-exclusive queues (deprecated in RabbitMQ 4.x)
deprecated_features.permit.transient_nonexcl_queues = true

# Logging
log.file.level = info
log.console = true
log.console.level = info